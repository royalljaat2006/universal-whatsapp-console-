# Single entrypoint: the browser, Meta's webhook calls and WebSockets all hit
# nginx. Same-origin routing means session cookies work without CORS.
#
#   /api/  /admin/  /static/  -> backend (Django, ASGI)
#   /webhooks/                -> backend (raw body preserved for HMAC)
#   /ws/                      -> backend (WebSocket upgrade)
#   /health/                  -> backend
#   everything else           -> frontend (Next.js)

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile      on;
  keepalive_timeout 65;

  # Correlation id: reuse the client's if present, else nginx's own.
  map $http_x_request_id $req_id {
    default   $http_x_request_id;
    ""        $request_id;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  log_format json escape=json '{"ts":"$time_iso8601","request_id":"$req_id","remote":"$remote_addr",'
                              '"method":"$request_method","uri":"$uri","status":$status,'
                              '"bytes":$body_bytes_sent,"duration_s":$request_time,'
                              '"upstream_s":"$upstream_response_time"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  # Re-resolve service names (Docker DNS) so a restarted container with a new
  # IP does not leave nginx pointing at a dead address (502s).
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream backend  { zone backend 64k;  server backend:8000 resolve;  keepalive 16; }
  upstream frontend { zone frontend 64k; server frontend:3000 resolve; keepalive 16; }

  # Webhook flood protection (per source IP). Meta batches deliveries, so a
  # generous burst is allowed; tune with real traffic data.
  limit_req_zone $binary_remote_addr zone=webhooks:10m rate=50r/s;

  server {
    listen 80;
    client_max_body_size 4m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $req_id;
    proxy_set_header Connection        "";

    location /webhooks/ {
      limit_req zone=webhooks burst=200 nodelay;
      proxy_request_buffering on;
      proxy_read_timeout 15s;
      proxy_pass http://backend;
    }

    location /ws/ {
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_pass http://backend;
    }

    # Media uploads: WhatsApp documents may be up to 100 MB (validated again in Django).
    location = /api/v1/media/ {
      client_max_body_size 101m;
      proxy_request_buffering on;
      proxy_read_timeout 120s;
      proxy_pass http://backend;
    }

    location ~ ^/(api|admin|static|health)/ {
      proxy_read_timeout 60s;
      proxy_pass http://backend;
    }

    location / {
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://frontend;
    }
  }
}
