# Local development stack.
#   docker compose up --build        -> http://localhost:8080
# Every published port binds to 127.0.0.1 only; nothing is exposed on the LAN.
# Production topology differs (see docs/deployment.md).

name: whatsapp-platform

x-backend: &backend
  build:
    context: .
    dockerfile: infrastructure/docker/backend/Dockerfile
    target: development
  env_file: .env
  volumes:
    - ./backend:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_platform}
      POSTGRES_USER: ${POSTGRES_USER:-whatsapp_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Periodic pg_dump -> gzip into a private volume, with retention pruning.
  # See docs/deployment.md#backups for the restore procedure (verified with
  # a real restore test, not assumed).
  backup:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-whatsapp_platform}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_platform}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - postgres-backups:/backups
      - ./infrastructure/docker/backup/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["sh", "/entrypoint.sh"]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # AOF persistence: the Celery broker lives here; a restart must not drop
    # queued jobs. (Webhook events are safe regardless — see the outbox sweeper.)
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    <<: *backend
    environment:
      RUN_MIGRATIONS: "true"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "-Q", "webhooks,outbound,media,campaigns,sync,analytics,default", "--concurrency=4"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # beat doesn't answer control pings (it's a scheduler, not a worker);
      # a live process is the liveness signal docker can act on. Scans /proc
      # directly (no ps/pgrep — not installed in this slim image).
      test: ["CMD-SHELL", "for p in /proc/[0-9]*; do tr '\\0' ' ' < \"$$p/cmdline\" 2>/dev/null | grep -q 'celery.*beat' && exit 0; done; exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile
      target: development
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    # >= 1.27.3 required: upstream `resolve` (re-resolve restarted containers).
    image: nginx:1.27-alpine
    environment:
      # Empty in local dev (paths at the root). Set to a subpath only when
      # reverse-proxied under one without prefix-stripping — docs/deployment.md.
      BASE_PATH: ${BASE_PATH:-}
    volumes:
      - ./infrastructure/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
    # Render the template (envsubst restricted to $BASE_PATH so nginx's own
    # runtime variables, e.g. $scheme, are left untouched) before starting.
    command: ["sh", "-c", "envsubst '$$BASE_PATH' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"]
    ports:
      # Override with NGINX_PORT when 8080 is already taken on the host
      # (e.g. a shared box running several projects).
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres-data:
  postgres-backups:
  redis-data:
  frontend-node-modules:
  frontend-next-cache:
