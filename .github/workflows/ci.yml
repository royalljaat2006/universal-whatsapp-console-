name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: whatsapp_platform
          POSTGRES_USER: whatsapp_platform
          POSTGRES_PASSWORD: change-me-dev-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U whatsapp_platform" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run mypy .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # Needs the full stack (nginx + backend + worker + postgres + redis +
    # frontend) wired together, not just backend or frontend in isolation —
    # that's what docker-compose already does for local development, so
    # this job reuses it as-is rather than reassembling the topology.
    steps:
      - uses: actions/checkout@v4
      - name: Write a CI .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=whatsapp_platform
          POSTGRES_USER=whatsapp_platform
          POSTGRES_PASSWORD=ci-only-not-a-real-secret
          DJANGO_SECRET_KEY=ci-only-not-a-real-secret-ci-only-not-a-real-secret
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost:8080
          FIELD_ENCRYPTION_KEYS=pZ1jz3kqGJ8Vqf0cS8tT7p9k7Yx2HqQ0b3cJ6gq4b1Y=
          META_APP_SECRET=ci-test-secret
          META_WEBHOOK_VERIFY_TOKEN=ci-test-verify-token
          # Real auth-scoped traffic here is this job's own E2E suite (up to
          # ~15 register/login calls across 7 tests in under a minute) —
          # not a production audience the default 10/min needs to protect.
          THROTTLE_AUTH=200/min
          EOF
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for nginx to serve the app
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/login >/dev/null 2>&1 && exit 0
            sleep 5
          done
          echo "Stack did not become ready in time" >&2
          docker compose ps
          docker compose logs --tail=200
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Show recent logs on failure
        if: failure()
        run: docker compose logs --tail=300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Tear down the stack
        if: always()
        run: docker compose down -v
